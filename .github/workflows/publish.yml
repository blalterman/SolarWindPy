name: Publish to PyPI

on:
  push:
    tags:
      - '20*'  # Release tags are the release date, 2026.12.3 (scripts/bump_version.py)
  workflow_dispatch:  # Allow manual trigger for testing
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      dry_run:
        description: 'Dry run (build only, no upload)'
        required: false
        default: true
        type: boolean
  # Weekly: platform-matrix runs the full suite on every OS and Python on master.
  # Every upload, release and feedstock step is gated on a tag push or
  # workflow_dispatch, so a scheduled run builds the package and uploads nothing.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

# Each job runs only in blalterman/SolarWindPy; copies of the repository (a private
# development copy, forks) run ci-master.yml instead. tests/test_workflow_gates.py checks it.
jobs:
  # Release gate: the full suite on every declared Python, on Linux, macOS, and Windows.
  # build-and-publish needs it, so nothing is built or uploaded unless every cell passes.
  platform-matrix:
    if: github.repository == 'blalterman/SolarWindPy'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    # Every run step is bash, so the same scripts work on the Windows runner.
    defaults:
      run:
        shell: bash
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # setup-python finds pip's cache directory on each OS; ~/.cache/pip
          # is not it on macOS or Windows.
          cache: pip
          cache-dependency-path: pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # tests/test_release_artifacts.py builds with --no-isolation and
          # skips without these, so install them to run it in the release gate.
          pip install build setuptools_scm wheel
      
      - name: Run comprehensive tests
        run: |
          pytest --tb=short --disable-warnings
      
      - name: Check imports and basic functionality
        run: |
          python -c "
          import solarwindpy as swp
          print(f'SolarWindPy version: {swp.__version__}')
          
          # Test core functionality
          import numpy as np
          from solarwindpy.core.plasma import Plasma
          from solarwindpy.core.ions import Ion
          
          print('Core classes imported successfully')
          "

  build-and-publish:
    if: github.repository == 'blalterman/SolarWindPy'
    needs: platform-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for setuptools_scm
      
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Verify tag format and version consistency
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          python scripts/bump_version.py --check "$TAG"
          
          # Install setuptools_scm to check version consistency
          pip install setuptools_scm
          
          # Get version from setuptools_scm
          DETECTED_VERSION=$(python -c "from setuptools_scm import get_version; print(get_version())")
          EXPECTED_VERSION=$TAG
          
          if [ "$DETECTED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "  Git tag version: $EXPECTED_VERSION"
            echo "  setuptools_scm detected: $DETECTED_VERSION"
            echo "Ensure tag version matches setuptools_scm configuration"
            exit 1
          fi

          # A release tag must name the release CITATION.cff cites;
          # tests/test_citation.py ties CITATION.cff to CHANGELOG.md in the release commit.
          if [[ "$TAG" != *rc* ]]; then
            CFF_VERSION=$(python -c "import pathlib, re; print(re.search(r'^version: \"(.+)\"$', pathlib.Path('CITATION.cff').read_text(encoding='utf-8'), re.M).group(1))")
            if [ "$CFF_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "Error: CITATION.cff names version $CFF_VERSION; the tag is $EXPECTED_VERSION"
              echo "Set CITATION.cff's version and date-released in the release commit"
              exit 1
            fi
          fi

          echo "✅ Publishing version $TAG (verified: $DETECTED_VERSION)"
      
      - name: Validate dependencies resolve
        run: |
          # pyproject.toml is the single declaration; check it resolves.
          pip install --dry-run .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"  # solarwindpy and its test tools, from pyproject.toml
      
      - name: Run full test suite
        run: |
          pip install pre-commit
          pre-commit run ruff-check --files $(git ls-files 'src/solarwindpy/*.py')
          pytest -q
      
      - name: Build package
        run: python -m build

      - name: Check wheel and sdist contents
        # The wheel holds only solarwindpy and its dist-info; the sdist drops
        # development-only directories.
        run: python scripts/check_release_artifacts.py dist
      
      - name: Check package with twine
        run: twine check dist/*
      
      - name: Verify package contents
        run: |
          echo "Built packages:"
          ls -la dist/
          echo ""
          echo "Package contents:"
          tar -tzf dist/*.tar.gz | head -20
          echo ""
          echo "Wheel contents:"
          unzip -l dist/*.whl | head -20
      
      # TestPyPI deployment (for testing)
      # Release candidates go to test
      - name: Publish to TestPyPI
        if: |
          (github.event_name == 'workflow_dispatch' && 
           github.event.inputs.target == 'testpypi' && 
           github.event.inputs.dry_run != 'true') ||
          (github.event_name == 'push' && 
           startsWith(github.ref, 'refs/tags/') && 
           contains(github.ref, 'rc'))  
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository_url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
        continue-on-error: true  # Don't fail if token not configured yet
      
      - name: TestPyPI Status Check
        if: failure() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'rc'))
        run: |
          echo "⚠️  TestPyPI publication failed (likely due to missing token)"
          echo ""
          echo "🔧 To enable TestPyPI publishing:"
          echo "   1. Go to https://test.pypi.org/manage/account/token/"
          echo "   2. Create a new API token with scope 'Entire account'"
          echo "   3. Add token as repository secret 'TEST_PYPI_API_TOKEN'"
          echo "   4. Re-run this workflow or create a new tag"
          echo ""
          echo "📦 Package was built successfully and is available in workflow artifacts"
      
      # Production PyPI deployment (only for non-RC tags)
      - name: Publish to PyPI
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi' && github.event.inputs.dry_run != 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        continue-on-error: true  # Don't fail if token not configured yet
      
      - name: PyPI Status Check
        if: failure() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'rc'))
        run: |
          echo "⚠️  PyPI publication failed (likely due to missing token)"
          echo ""
          echo "🔧 To enable PyPI publishing:"
          echo "   1. Go to https://pypi.org/manage/account/token/"
          echo "   2. Create a new API token with scope 'Entire account'"
          echo "   3. Add token as repository secret 'PYPI_API_TOKEN'"
          echo "   4. Re-run this workflow or create a new tag"
          echo ""
          echo "📦 Package was built successfully and is available in workflow artifacts"
          echo "🚨 Production releases require manual PyPI token configuration"
      
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          name: "SolarWindPy ${{ github.ref_name }}"
          body: |
            ## 🚀 SolarWindPy Release ${{ github.ref_name }}
            
            **Version**: `${{ github.ref_name }}`
            **Commit**: ${{ github.sha }}
            **Build Date**: ${{ github.run_started_at }}
            
            ### 📦 Installation
            ```bash
            pip install solarwindpy==${{ github.ref_name }}
            ```
            
            ### 🔍 Package Verification  
            ```python
            import solarwindpy
            print(solarwindpy.__version__)  # Should show ${{ github.ref_name }}
            ```
            
            ### 📋 What's Included
            - **Source Distribution** (`.tar.gz`): Full source code with setup metadata
            - **Wheel Package** (`.whl`): Pre-built binary distribution for faster installation
            
            ---
            *Auto-generated release from GitHub Actions*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Conda feedstock automation job (only for stable releases)
  update-conda-feedstock:
    needs: build-and-publish
    runs-on: ubuntu-latest
    # Only run for stable releases (no RC, beta, alpha, dev)
    if: |
      github.repository == 'blalterman/SolarWindPy' && (
        github.event_name == 'push' && 
        startsWith(github.ref, 'refs/tags/') && 
        !contains(github.ref, 'rc') && 
        !contains(github.ref, 'beta') && 
        !contains(github.ref, 'alpha') && 
        !contains(github.ref, 'dev')
      )
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install conda automation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests packaging pyyaml click
      
      - name: Set up GitHub CLI
        run: |
          # Verify gh CLI is available and authenticated
          gh auth status || echo "GitHub CLI not authenticated - will continue with limited functionality"
      
      - name: Wait for PyPI availability
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Waiting for solarwindpy $VERSION to be available on PyPI..."
          python scripts/wait_for_pypi.py "$VERSION" --timeout 600 --interval 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update conda feedstock (create tracking issue)
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Starting conda feedstock update for version $VERSION"
          python scripts/update_conda_feedstock.py "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      
      - name: Conda feedstock update summary
        if: always()
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "## 📋 Conda Feedstock Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Automation completed successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- PyPI availability confirmed" >> $GITHUB_STEP_SUMMARY
            echo "- SHA256 hash calculated" >> $GITHUB_STEP_SUMMARY
            echo "- Tracking issue created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next Steps (Manual)**:" >> $GITHUB_STEP_SUMMARY
            echo "1. Check the created GitHub issue for details" >> $GITHUB_STEP_SUMMARY
            echo "2. Follow manual steps to create conda-forge PR" >> $GITHUB_STEP_SUMMARY
            echo "3. Monitor CI checks and merge when ready" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Automation encountered issues**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Manual Fallback**:" >> $GITHUB_STEP_SUMMARY
            echo "1. Verify PyPI release: https://pypi.org/project/solarwindpy/$VERSION/" >> $GITHUB_STEP_SUMMARY
            echo "2. Run: \`python scripts/update_conda_feedstock.py $VERSION --dry-run\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Follow the manual conda-forge update process" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Resources**:" >> $GITHUB_STEP_SUMMARY
          echo "- [conda-forge feedstock](https://github.com/conda-forge/solarwindpy-feedstock)" >> $GITHUB_STEP_SUMMARY
          echo "- [PyPI release](https://pypi.org/project/solarwindpy/$VERSION/)" >> $GITHUB_STEP_SUMMARY
          echo "- [conda-forge documentation](https://conda-forge.org/docs/maintainer/updating_pkgs.html)" >> $GITHUB_STEP_SUMMARY
