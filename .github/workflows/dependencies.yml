name: Dependencies

# The dependency policy in CONTRIBUTING.md ("Dependency support"): PHEP 3 with
# documented deviations, and floors at versions the suite passes on.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The PHEP 3 support window. The ignore list is the documented deviations;
  # remove matplotlib once matplotlib 3.10 leaves the window on 2026-12-14.
  phep3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: heliophysicsPy/pyhc-actions/phep3-compliance@v1
        with:
          ignore-errors-for: scipy,pandas,matplotlib

  # The declared floors: install the lowest version each direct dependency
  # allows and run the suite on them.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm versions the editable install from the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the lowest declared versions
        run: |
          python -m pip install --upgrade pip uv
          uv venv .venv
          uv pip install --python .venv/bin/python --resolution lowest-direct -e ".[test]"
          # Not under lowest-direct: unpinned, these would resolve to their
          # first releases (wheel 0.1). tests/test_release_artifacts.py uses them.
          uv pip install --python .venv/bin/python build setuptools_scm wheel
          uv pip list --python .venv/bin/python

      - name: Run tests
        run: .venv/bin/python -m pytest -q --tb=short

  # The conda path: build the env from solarwindpy.yml (generated from
  # pyproject.toml, held by tests/test_conda_env.py), register the checkout
  # with pip and nothing else, and run the suite in it.
  conda-env:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm versions the editable install from the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: solarwindpy.yml
          activate-environment: solarwindpy
          conda-remove-defaults: "true"

      - name: Register the checkout
        run: pip install -e . --no-deps --no-build-isolation

      - name: The installed packages meet pyproject.toml
        run: pip check

      - name: Run tests
        run: python -m pytest -q --tb=short
