name: Documentation

on:
  push:
    branches: ['**']  # Build on all branches
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # Install pytables separately if needed by the package
          pip install --verbose tables
          pip install -e ".[docs]"
      
      - name: Lint documentation with doc8
        run: doc8 README.rst docs CITATION.rst --max-line-length=100

      # Advisory: external sites fail transiently. linkcheck is a builtin
      # Sphinx builder; the source directory is the one holding conf.py.
      - name: Check documentation links
        run: sphinx-build -b linkcheck docs/source docs/build/linkcheck
        continue-on-error: true

      - name: Build documentation
        env:
          SPHINXOPTS: -W --keep-going -n  # Warnings as errors, but show all
        working-directory: docs
        run: |
          make clean
          make html

      # Advisory report of undocumented objects (sphinx.ext.coverage builder).
      - name: Check documentation coverage
        run: |
          sphinx-build -b coverage docs/source docs/build/coverage
          cat docs/build/coverage/python.txt
        continue-on-error: true

      - name: Upload documentation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ github.run_id }}
          path: |
            docs/build/html/
            docs/build/doctrees/
            docs/build/coverage/
            docs/build/linkcheck/
          retention-days: 90

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # Install pytables separately if needed by the package
          pip install --verbose tables
          pip install -e ".[docs]"
      
      - name: Build documentation for deployment
        working-directory: docs
        run: |
          make clean
          make html
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          cname: solarwindpy.github.io  # If you have a custom domain