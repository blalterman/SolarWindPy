name: Continuous Integration

# Lightweight PR validation workflow
# Clean architecture replacing broken ci.yml for branch/PR testing
on:
  pull_request:
    branches:
      - master
      - 'feature/**'
  push:
    branches:
      - 'feature/**'
      # Exclude master to avoid duplicate runs with release-pipeline

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Quick validation for PRs and branch pushes
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # tests/test_release_artifacts.py builds with --no-isolation and needs these
          pip install build setuptools_scm wheel
      
      - name: Run core tests
        run: |
          pytest --tb=short --disable-warnings tests/
      
      - name: Check code formatting
        # ruff runs at the version pinned in .pre-commit-config.yaml,
        # the one place that version is declared.
        run: |
          pip install pre-commit
          pre-commit run ruff-check --files $(git ls-files 'src/solarwindpy/*.py')
          pre-commit run ruff-format --show-diff-on-failure --files $(git ls-files 'src/solarwindpy/*.py')
      
      - name: Verify imports
        run: |
          python -c "import solarwindpy as swp; print(f'SolarWindPy imported successfully')"

      - name: Check import layering
        # Contracts live in pyproject.toml [tool.importlinter].
        run: |
          lint-imports

      - name: Build and check release artifacts
        # The same isolated build the publish workflow runs, then the same check.
        run: |
          python -m build --outdir dist
          python scripts/check_release_artifacts.py dist

  # Decide whether a PR needs the Windows suite: skip it only when every changed
  # file is documentation. Runs on pull requests only, so branch pushes skip Windows.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        name: Detect changes the Windows suite covers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$files"
          if printf '%s\n' "$files" | grep -vqE '^(docs/|paper/|\.claude/)|\.(md|rst)$|^(CITATION\.cff|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Test suite on Windows (PyHC standard #4: support all major operating systems).
  # Lint, import layering, and the release build stay on the Linux validate job.
  # Pull requests that change code only; the release matrix also tests Windows on tags.
  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # The suite takes about 2 minutes here; bound a hung test well below
    # GitHub's 6-hour default.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # tests/test_release_artifacts.py builds with --no-isolation and needs these
          python -m pip install build setuptools_scm wheel

      - name: Run core tests
        run: |
          pytest --tb=short --disable-warnings tests/

  # Summary job
  ci-summary:
    needs: [changes, validate, test-windows]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: CI Summary
        run: |
          echo "🏁 Continuous Integration Summary"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo ""
          echo "Job Results:"
          echo "- Quick Validation: ${{ needs.validate.result }}"
          echo "- Windows Tests: ${{ needs.test-windows.result }}"
          echo ""
          # Windows may be skipped (docs-only PR, or a branch push), but only when the
          # change detection itself did not fail.
          windows="${{ needs.test-windows.result }}"
          changes="${{ needs.changes.result }}"
          if [[ "$windows" == "skipped" && "$changes" != "failure" && "$changes" != "cancelled" ]]; then
            windows=success
          fi
          if [[ "${{ needs.validate.result }}" == "success" && "$windows" == "success" ]]; then
            echo "✅ PR validation passed - ready for review"
          else
            echo "❌ PR validation failed - requires fixes"
            exit 1
          fi
