name: Continuous Integration

# Lightweight PR validation workflow
# Clean architecture replacing broken ci.yml for branch/PR testing
on:
  pull_request:
    branches:
      - master
      - 'feature/**'
  push:
    branches:
      - 'feature/**'
      # Exclude master to avoid duplicate runs with release-pipeline

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Quick validation for PRs and branch pushes
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run core tests
        run: |
          pytest --tb=short --disable-warnings tests/
      
      - name: Check code formatting
        # black and flake8 run at the versions pinned in .pre-commit-config.yaml,
        # the one place those versions are declared.
        run: |
          pip install pre-commit
          pre-commit run black --show-diff-on-failure --files $(git ls-files 'solarwindpy/*.py')
          pre-commit run flake8 --files $(git ls-files 'solarwindpy/*.py')
      
      - name: Verify imports
        run: |
          python -c "import solarwindpy as swp; print(f'SolarWindPy imported successfully')"

      - name: Check import layering
        # Contracts live in pyproject.toml [tool.importlinter].
        run: |
          lint-imports

  # Summary job
  ci-summary:
    needs: [validate]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: CI Summary
        run: |
          echo "🏁 Continuous Integration Summary"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo ""
          echo "Job Results:"
          echo "- Quick Validation: ${{ needs.validate.result }}"
          echo ""
          if [[ "${{ needs.validate.result }}" == "success" ]]; then
            echo "✅ PR validation passed - ready for review"
          else
            echo "❌ PR validation failed - requires fixes"
          fi
