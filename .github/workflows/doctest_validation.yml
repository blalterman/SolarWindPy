name: Doctest Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run weekly to catch environmental changes
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  doctest-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install package and test dependencies
      run: |
        pip install -e ".[test]"

    # pytest's doctest collection imports each module as part of the package,
    # so a module that fails to import is a failure rather than a silent skip.
    - name: Run docstring examples
      run: pytest --doctest-modules solarwindpy -q

    - name: Run documentation examples
      run: pytest --doctest-glob='*.rst' docs/source -q

  # Drift detection: asserts the external facts SolarWindPy pins (catalog
  # version, dependency resolution, toolchain pins, etc.) still hold. Opt-in
  # and network-dependent, so it only runs on schedule or on demand.
  drift-detection:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run drift detection suite
      env:
        SWP_RUN_DRIFT: "1"
      run: |
        pytest tests/drift/ -v --tb=short
