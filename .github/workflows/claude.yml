name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Optional: Override the model. v1 has no `model` input; it is passed
          # through to the CLI. Left unset so we inherit the action's current
          # default rather than pinning an ID that will eventually be retired.
          # claude_args: "--model claude-opus-4-1-20250805"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Allow Claude to run specific commands. v1 removed the
          # `allowed_tools` input; tool permissions go through claude_args.
          # claude_args: "--allowedTools 'Bash(pytest -q),Bash(black:*),Bash(flake8:*)'"

          # Optional: Add custom instructions for Claude. v1 removed the
          # `custom_instructions` input; put project guidance in CLAUDE.md
          # (which this repo already has) or in the `prompt` input.

          # Optional: Custom environment variables. v1 removed the `claude_env`
          # input; use this step's standard `env:` block instead.

