name: CI

# Lightweight master branch validation for CI badge status
# Focused on core functionality testing for repository health indicator
on:
  push:
    branches:
      - master

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run core tests
        run: |
          pytest --tb=short --disable-warnings tests/
      
      - name: Check code formatting
        # black and flake8 run at the versions pinned in .pre-commit-config.yaml,
        # the one place those versions are declared.
        run: |
          pip install pre-commit
          pre-commit run black --show-diff-on-failure --files $(git ls-files 'solarwindpy/*.py')
          pre-commit run flake8 --files $(git ls-files 'solarwindpy/*.py')
      
      - name: Verify imports and basic functionality
        run: |
          python -c "
          import solarwindpy as swp
          print(f'SolarWindPy version: {swp.__version__}')
          
          # Test core functionality
          import numpy as np
          from solarwindpy.core.plasma import Plasma
          from solarwindpy.core.ions import Ion
          
          print('✅ Core classes imported successfully')
          print('✅ Master branch validation complete')
          "