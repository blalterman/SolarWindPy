version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    # pyproject.toml is the single declaration; the lockfiles are generated
    # from it by sync-requirements.yml. `widen` edits pyproject.toml ranges
    # only to admit a release outside them, raising upper bounds and leaving
    # the measured floors to the author.
    directory: "/"
    versioning-strategy: widen
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      development:
        patterns:
          - "pytest*"
          - "black"
          - "flake8*"
          - "doc8"
      documentation:
        patterns:
          - "sphinx*"
          - "numpydoc"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
  
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"