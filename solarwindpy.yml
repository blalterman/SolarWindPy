# SolarWindPy Conda Environment File
#
# This file lists packages WITHOUT version pins. This is intentional:
# 1. Conda resolves to latest compatible versions from conda-forge
# 2. `pip install -e ".[dev]"` enforces pyproject.toml's minimum requirements
# 3. Avoids PyPI/conda-forge version mismatches that break CI
#
# pyproject.toml declares the requirements; this file names their conda
# packages (PyTables is `pytables` here, `tables` on PyPI) plus test and
# documentation tools. pyyaml is a test-time dependency.
#
# No Python version is listed, so conda picks one; pyproject.toml's
# requires-python names the supported range. No workflow reads this file.
#
# For local use:
#   conda env create -f solarwindpy.yml
#   conda activate solarwindpy
#   pip install -e ".[dev]"  # Installs SolarWindPy in editable mode with dev tools
#
name: solarwindpy
channels:
- conda-forge
dependencies:
- alabaster
- astropy
- astropy-iers-data
- babel
- python-blosc2
- bottleneck
- certifi
- cfgv
- charset-normalizer
- click
- contourpy
- coverage[toml]
- cycler
- distlib
- doc8
- docstring-inheritance
- docutils
- filelock
- fonttools
- identify
- idna
- imagesize
- iniconfig
- jinja2
- kiwisolver
- latexcodec
- llvmlite
- markupsafe
- matplotlib
- msgpack-python
- mypy_extensions
- ndindex
- nodeenv
- numba
- numexpr
- numpy
- numpydoc
- packaging
- pandas
- pathspec
- pillow
- platformdirs
- pluggy
- pre-commit
- py-cpuinfo
- pybtex
- pybtex-docutils
- pyenchant
- pyerfa
- pygments
- pyparsing
- pytest
- pytest-cov
- python-dateutil
- pytokens
- pytz
