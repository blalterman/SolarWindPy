[tool.black]
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.eggs
  | \.travis.yml
  | \.
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
markers = [
    "drift: asserts an external fact still holds; requires network; opt-in",
    "integration: downloads real data over the network",
    "slow: takes more than a few seconds",
]

# Import layering, checked by `lint-imports` (import-linter). The layer rule is
# stated in .claude/docs/TEST_PATTERNS.md "Structure and layering".
[tool.importlinter]
root_package = "solarwindpy"

[[tool.importlinter.contracts]]
name = "Subpackage layers: core and tools import nothing above them"
type = "layers"
containers = ["solarwindpy"]
layers = [
    "fitfunctions | instabilities | solar_activity",
    "plotting",
    "core | tools",
]

[[tool.importlinter.contracts]]
name = "No import cycles between sibling modules"
type = "acyclic_siblings"
ancestors = ["solarwindpy"]

[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Only consider v* tags for versioning (exclude compaction tags)
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Use git describe with version tags only
git_describe_command = "git describe --dirty --tags --long --match 'v*'"

[project]
name = "solarwindpy"
description = "Python package for solar wind data analysis."
readme = "README.rst"
requires-python = ">=3.12,<4"
license = {file = "LICENSE"}
authors = [
  {name = "B. L. Alterman", email = "blaltermanphd@gmail.com"}
]
dynamic = ["version"]
dependencies = [
  "numpy>=1.26,<3.0",  # NumPy 2.0 support; requires numba>=0.59
  "scipy>=1.16",       # oldest version the suite runs on; CODATA 2022 constants
  "pandas>=3,<4",      # one supported major; the suite runs on the latest release
  "numexpr>=2.8",
  "bottleneck>=1.3",
  "h5py>=3.8",
  "pyyaml>=6.0",
  "matplotlib>=3.10",  # oldest version the suite runs on
  "astropy>=5.0",
  "numba>=0.59",       # Minimum for NumPy 2.0 support
  "tabulate>=0.9",
  "docstring-inheritance>=3.0,<4",  # 3.x: inheritance switched on by solarwindpy/__init__.py
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
  "plasma",
  "physics",
  "solar wind",
  "measurements",
  "in situ",
  "spacecraft",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "packaging>=23.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx_rtd_theme>=2.0",
    "sphinxcontrib-spelling>=8.0",
    "sphinxcontrib-bibtex>=2.6",
    "numpydoc>=1.6",
    "docstring-inheritance>=3.0,<4",
    "doc8>=1.1",
]
dev = [
    # Testing tools
    "pytest>=9.0",
    "pytest-cov>=6.0",
    # Documentation tools
    "sphinx>=7.0",
    "sphinx_rtd_theme>=2.0",
    "sphinxcontrib-spelling>=8.0",
    "sphinxcontrib-bibtex>=2.6",
    "numpydoc>=1.6",
    "docstring-inheritance>=3.0,<4",
    "doc8>=1.1",
    # Development tools
    "black>=24.0",
    "flake8>=7.0",
    "flake8-docstrings>=1.7",
    "pydocstyle>=6.3",
    "tables>=3.9",  # PyTables for HDF5 testing
    "import-linter>=2.6",  # lint-imports; 2.6 adds the acyclic_siblings contract
    "pre-commit>=3.5",  # Git hook framework
    # Test-quality review tools; the review's tool trial decides which stay
    "griffe>=2.3",  # API inventory
    "mutmut>=3.8",  # mutation testing
    "sybil>=10.1",  # run rst code-block examples under pytest
    "pytest-randomly>=5.0",  # random test order
    "grimp>=3.17",  # import graph
    "pydeps>=3.0",  # import graph rendering
    "radon>=5.1",  # complexity; wily 1.25 pins radon<5.2
    "wily>=1.25",  # complexity over history
    "vulture>=2.16",  # dead code
    "deptry>=0.25",  # imports vs declared dependencies
    "pytest-deadfixtures>=3.1",  # unused fixtures
    "ruff>=0.16",  # PT and B rule sets
    "interrogate>=1.7",  # docstring coverage
]
analysis = [
    # Interactive analysis environment
    "jupyterlab>=4.0",
    "tqdm>=4.0",        # Progress bars
    "ipywidgets>=8.0",  # Interactive widgets
]

[project.urls]
"Bug Tracker" = "https://github.com/blalterman/SolarWindPy/issues"
"Source" = "https://github.com/blalterman/SolarWindPy"

[tool.setuptools.package-data]
solarwindpy = ["core/data/*.csv"]

[tool.pip-tools]
# pip-compile configuration for lockfile generation
generate-hashes = false  # Set to true for security-critical deployments
allow-unsafe = true      # Allow pip, setuptools, wheel in lockfiles
