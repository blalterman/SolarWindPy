# Ruff is the linter and formatter, for Python sources only (not notebooks or
# Markdown code blocks). Lint rules: pycodestyle (E, W), pyflakes (F), mccabe
# (C90) and pydocstyle (D) under the numpy convention.
[tool.ruff]
line-length = 88
target-version = "py312"
include = ["*.py", "*.pyi"]
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "D"]
ignore = [
    "E231", "E501",
    "D100", "D101", "D102", "D103", "D104", "D105",
    "D200", "D202", "D209", "D214", "D215",
    "D300",
    "D400", "D401", "D403", "D404", "D405", "D409", "D412", "D414",
]

[tool.ruff.lint.per-file-ignores]
# `l` as a short loop or unpacking target (a left bound, a label).
"src/solarwindpy/plotting/hist1d.py" = ["E741"]
"src/solarwindpy/plotting/hist2d.py" = ["E741"]
"src/solarwindpy/plotting/tools.py" = ["E741"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
# The defaults: double quotes, space indentation, magic trailing commas.
quote-style = "double"

[tool.pytest.ini_options]
# Import this checkout's package, not whichever checkout the editable install
# points at, so every worktree's suite and commit hook test their own src/.
pythonpath = ["src"]
testpaths = ["tests"]
strict_markers = true
markers = [
    "drift: asserts an external fact still holds; requires network; opt-in",
    "integration: downloads real data over the network",
    "slow: takes more than a few seconds",
]

# Import layering, checked by `lint-imports` (import-linter). The layer rule is
# stated in .claude/docs/TEST_PATTERNS.md "Structure and layering".
[tool.importlinter]
root_package = "solarwindpy"

[[tool.importlinter.contracts]]
name = "Subpackage layers: core and tools import nothing above them"
type = "layers"
containers = ["solarwindpy"]
layers = [
    "fitfunctions | instabilities | solar_activity",
    "plotting",
    "core | tools",
]

[[tool.importlinter.contracts]]
name = "No import cycles between sibling modules"
type = "acyclic_siblings"
ancestors = ["solarwindpy"]

[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Only consider v* tags for versioning (exclude compaction tags)
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Use git describe with version tags only
git_describe_command = "git describe --dirty --tags --long --match 'v*'"

[project]
name = "solarwindpy"
description = "A Python Library for in situ solar wind data analysis."
readme = "README.rst"
requires-python = ">=3.12,<4"
license = {file = "LICENSE"}
authors = [
  {name = "B. L. Alterman", email = "blaltermanphd@gmail.com"}
]
dynamic = ["version"]
dependencies = [
  "numpy>=1.26,<3.0",  # NumPy 2.0 support; requires numba>=0.59
  "scipy>=1.16",       # oldest version the suite runs on; CODATA 2022 constants
  "pandas>=3,<4",      # one supported major; the suite runs on the latest release
  "numexpr>=2.8",      # not imported; pandas uses it to accelerate eval and query
  "bottleneck>=1.3",   # not imported; pandas uses it to accelerate reductions
  "tables>=3.9",       # PyTables: the pandas HDF5 backend behind Plasma.save and load_from_file
  "matplotlib>=3.10",  # oldest version the suite runs on
  "astropy>=8",        # one download-cache location, ~/.cache/solarwindpy
  "numba>=0.59",       # Minimum for NumPy 2.0 support
  "tabulate>=0.9",
  "docstring-inheritance>=3.0,<4",  # 3.x: inheritance switched on by src/solarwindpy/__init__.py
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
  "plasma",
  "physics",
  "solar wind",
  "measurements",
  "in situ",
  "spacecraft",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "packaging>=23.0",
    "pyyaml>=6.0",  # tests/test_declared_versions.py reads YAML
    "requests>=2.31",  # tests/test_update_conda_feedstock.py stubs requests.get
]
docs = [
    "sphinx>=7.0",
    "sphinx_rtd_theme>=2.0",
    "sphinxcontrib-spelling>=8.0",
    "sphinxcontrib-bibtex>=2.6",
    "sphinx-copybutton>=0.5",
    "numpydoc>=1.6",
    "docstring-inheritance>=3.0,<4",
    "doc8>=1.1",
    "myst-parser>=3.0",  # Markdown pages (CONTRIBUTING.md, CODE_OF_CONDUCT.md)
]
dev = [
    # Testing tools
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",  # tests/test_declared_versions.py reads YAML
    "requests>=2.31",  # tests/test_update_conda_feedstock.py stubs requests.get
    # Documentation tools
    "sphinx>=7.0",
    "sphinx_rtd_theme>=2.0",
    "sphinxcontrib-spelling>=8.0",
    "sphinxcontrib-bibtex>=2.6",
    "sphinx-copybutton>=0.5",
    "numpydoc>=1.6",
    "docstring-inheritance>=3.0,<4",
    "doc8>=1.1",
    "myst-parser>=3.0",  # Markdown pages (CONTRIBUTING.md, CODE_OF_CONDUCT.md)
    # Development tools
    "import-linter>=2.6",  # lint-imports; 2.6 adds the acyclic_siblings contract
    "pre-commit>=3.5",  # Git hook framework
    # Test-quality review tools
    "griffe>=2.3",  # API inventory
    "mutmut>=3.8",  # mutation testing
    "sybil>=10.1",  # run rst code-block examples under pytest
    "pytest-randomly>=5.0",  # random test order
    "vulture>=2.16",  # dead code
    "ruff>=0.16",  # linter and formatter
]
analysis = [
    # Interactive analysis environment
    "jupyterlab>=4.0",
    "tqdm>=4.0",        # Progress bars
    "ipywidgets>=8.0",  # Interactive widgets
]

[project.urls]
"Bug Tracker" = "https://github.com/blalterman/SolarWindPy/issues"
"Source" = "https://github.com/blalterman/SolarWindPy"
"Documentation" = "https://solarwindpy.readthedocs.io"

[tool.setuptools.package-data]
solarwindpy = ["core/data/*.csv"]

[tool.pip-tools]
# pip-compile configuration for lockfile generation
generate-hashes = false  # Set to true for security-critical deployments
allow-unsafe = true      # Allow pip, setuptools, wheel in lockfiles
