repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: trailing-whitespace
    files: ^(solarwindpy|tests|scripts|\.claude)/.*\.py$
    exclude: \.claude/templates/.*\.py$
  - id: check-merge-conflict
    files: ^(solarwindpy|tests|scripts|\.claude)/.*\.py$
    exclude: \.claude/templates/.*\.py$
  - id: check-added-large-files
    args: [--maxkb=5000]
    files: ^(solarwindpy|tests|scripts|\.claude)/.*\.py$
    exclude: \.claude/templates/.*\.py$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff-check
    files: ^(solarwindpy|tests|scripts|\.claude)/.*\.py$
    exclude: \.claude/templates/.*\.py$
  - id: ruff-format
    files: ^(solarwindpy|tests|scripts|\.claude)/.*\.py$
    exclude: \.claude/templates/.*\.py$

- repo: https://github.com/PyCQA/doc8
  rev: v1.1.1
  hooks:
  - id: doc8
    name: doc8 - Documentation linter
    args: ['--max-line-length=100', '--quiet']
    files: \.(py|rst|md)$
    exclude: |
      (?x)^(
        docs/build/|
        docs/_build/|
        \.claude/templates/
      )$

- repo: local
  hooks:
  - id: check-conventional-commits
    name: Check Conventional Commits
    entry: scripts/check_conventional_commits.sh
    language: system
    stages: [commit-msg]
  - id: solarwindpy-physics
    name: SolarWindPy Physics Validation
    entry: .claude/hooks/pre-commit-tests.sh
    language: system
    files: \.py$
    pass_filenames: false
  - id: import-test
    name: Import Testing
    entry: .claude/hooks/project-env.sh python -c
    args: ["import solarwindpy; print('✓ Import successful')"]
    language: system
    files: ^solarwindpy/.*\.py$
    pass_filenames: false
