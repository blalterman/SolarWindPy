[options]
package_dir =
    = src
# find_namespace: so data-only directories such as core/data, which hold
# package-data CSVs and no __init__.py, are packages setuptools can ship.
packages = find_namespace:
include_package_data = True

tests_require =
    pytest

# Only the solarwindpy package ships in the wheel; tests/ has an __init__.py,
# so an unrestricted find: would install it as a top-level `tests` package.
[options.packages.find]
where = src
include =
    solarwindpy
    solarwindpy.*


[bdist_wheel]
universal=0

[doc8]
max-line-length = 100
ignore-path = docs/build,docs/_build,*.egg-info,.claude/templates
file-encoding = utf-8
